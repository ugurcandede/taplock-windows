name: Build & Release

on:
  push:
    branches: [master]
    paths-ignore:
      - '**.md'
      - 'screenshots/**'
  # Lets a release be cut from the Actions tab without pushing anything, and
  # gives a way to tell "the trigger did not match" apart from "Actions is off".
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Determine version
        id: version
        shell: bash
        run: |
          LATEST=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          MAJOR=$(echo "$LATEST" | sed 's/v//' | cut -d. -f1)
          MINOR=$(echo "$LATEST" | sed 's/v//' | cut -d. -f2)
          PATCH=$(echo "$LATEST" | sed 's/v//' | cut -d. -f3)

          # Semantic versioning from commit message prefix, same rule as
          # taplock-app: BREAKING:/bump: -> major, feat: -> minor, else patch.
          MSG=$(git log -1 --pretty=%s)
          if echo "$MSG" | grep -qiE '^(BREAKING|bump):'; then
            MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0
          elif echo "$MSG" | grep -qi '^feat:'; then
            MINOR=$((MINOR + 1)); PATCH=0
          else
            PATCH=$((PATCH + 1))
          fi

          echo "tag=v${MAJOR}.${MINOR}.${PATCH}" >> $GITHUB_OUTPUT
          echo "version=${MAJOR}.${MINOR}.${PATCH}" >> $GITHUB_OUTPUT
          echo "New version: v${MAJOR}.${MINOR}.${PATCH} (from: $MSG)"

      - name: Inject version
        shell: pwsh
        run: |
          $content = Get-Content version.py -Raw
          $updated = $content -replace 'VERSION = "dev"', 'VERSION = "${{ steps.version.outputs.version }}"'
          if ($content -eq $updated) { throw "version.py did not contain the placeholder" }
          Set-Content version.py -Value $updated -NoNewline

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pyinstaller

      - name: Test
        run: pytest -q

      - name: Build
        run: pyinstaller --noconfirm --clean taplock.spec

      - name: Package
        id: package
        shell: pwsh
        run: |
          Compress-Archive -Path dist/TapLock -DestinationPath TapLock-windows.zip
          $hash = (Get-FileHash TapLock-windows.zip -Algorithm SHA256).Hash
          # Out-File rather than >>: the redirect operator picks up the console
          # encoding and can write a BOM the runner then fails to parse.
          "sha256=$hash" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host ("{0:N1} MB" -f ((Get-Item TapLock-windows.zip).Length / 1MB))

      - name: Create tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.version.outputs.tag }}" -m "Release ${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: TapLock for Windows ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: TapLock-windows.zip
          body: |
            **SHA256:** `${{ steps.package.outputs.sha256 }}`

            ### Install

            Download `TapLock-windows.zip`, extract it anywhere, and run `TapLock.exe`.

            The executable is unsigned, so SmartScreen may stop it the first
            time — choose **More info → Run anyway**.

            Requires Windows 10 version 1809 or later.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
